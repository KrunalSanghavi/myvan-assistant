name: Bug
description: Something is wrong or a reading looks off
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: What you saw and what you expected }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, description: Screen, adapter, engine state (off, idle, driving) }
  - type: input
    id: device
    attributes: { label: Device and browser, placeholder: "Pixel 8, Chrome 141, Vgate iCar Pro BLE" }
  - type: textarea
    id: traffic
    attributes: { label: Adapter traffic, description: Paste from the Log screen if relevant, render: text }
