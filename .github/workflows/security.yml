name: Security
# SAST (CodeQL), dependency audit, secret scan and DAST (OWASP ZAP baseline). See SECURITY.md.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"   # weekly, Monday 06:23 UTC: also scans the live site
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codeql:
    name: SAST (CodeQL, ${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write, actions: read }
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  deps:
    name: Dependencies (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=low

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    permissions: { contents: read, issues: read }
    steps:
      - uses: actions/checkout@v4
      - name: Serve the app
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8080/ >/dev/null && break; sleep 0.5; done
      - name: ZAP baseline (this commit)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://127.0.0.1:8080/
          rules_file_name: .zap/rules.tsv
          cmd_options: "-I"
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-local
      - name: ZAP baseline (live site, weekly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: https://krunalsanghavi.github.io/myvan-assistant/
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-live
