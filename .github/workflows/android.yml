name: Android
# The Android app in android/ (#85). Fixtures come from index.html, so changes there run this too.
on:
  pull_request:
    paths: ["android/**", "index.html", "scripts/android-fixtures.mjs", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", "index.html", "scripts/android-fixtures.mjs", ".github/workflows/android.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run fixtures
        env: { CI: "true" }
      - name: Fixtures are current
        run: |
          git diff --exit-code -- android || { echo "::error::Fixtures are out of date. Run 'npm run fixtures' and commit the result."; exit 1; }
          test -z "$(git status --porcelain -- android)" || { git status --porcelain -- android; echo "::error::New fixture files are not committed. Run 'npm run fixtures'."; exit 1; }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: 17 }
      # No Gradle wrapper yet (follow-up): a pinned Gradle version is installed and cached instead.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with: { gradle-version: "8.14.3" }
      - name: Test, lint and build
        working-directory: android
        run: gradle test lint assembleDebug --stacktrace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: myvan-debug-apk, path: android/app/build/outputs/apk/debug/*.apk, retention-days: 14 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: android-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          retention-days: 7
