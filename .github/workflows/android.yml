name: Android
# The Android app in android/ (#85). Fixtures come from index.html, so changes there run this too.
# Every PR runs the "Android build" gate job (a required check). It builds only when the PR
# touches Android files, and passes straight away when it doesn't.
on:
  pull_request:
  push:
    branches: [main]
    paths: ["android/**", "index.html", "scripts/android-fixtures.mjs", ".github/workflows/android.yml"]
permissions:
  contents: read
jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.diff.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - id: diff
        env: { BASE: "${{ github.event.pull_request.base.sha }}" }
        run: |
          if git diff --name-only "$BASE" HEAD | grep -qE '^(android/|index\.html$|scripts/android-fixtures\.mjs$|\.github/workflows/android\.yml$)'; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.android == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run fixtures
        env: { CI: "true" }
      - name: Fixtures are current
        run: |
          git diff --exit-code -- android || { echo "::error::Fixtures are out of date. Run 'npm run fixtures' and commit the result."; exit 1; }
          test -z "$(git status --porcelain -- android)" || { git status --porcelain -- android; echo "::error::New fixture files are not committed. Run 'npm run fixtures'."; exit 1; }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: 17 }
      # No Gradle wrapper yet (follow-up): a pinned Gradle version is installed and cached instead.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with: { gradle-version: "8.14.3" }
      - name: Test, lint and build
        working-directory: android
        run: gradle test lint assembleDebug --stacktrace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: myvan-debug-apk, path: android/app/build/outputs/apk/debug/*.apk, retention-days: 14 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: android-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          retention-days: 7
  # After a merge to main, the debug APK goes on the "android-test" pre-release, so the owner
  # can install it on a phone from a plain link (Actions artifacts are hard to reach on a phone).
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: myvan-debug-apk, path: apk }
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          mv apk/app-debug.apk apk/myvan-test.apk
          notes="Test build of the Android app (#85), from commit ${SHA:0:7}. Not a release.
          To install: on your phone, tap myvan-test.apk below, then Install. If it won't install over an older test build, uninstall MyVan first."
          if gh release view android-test >/dev/null 2>&1; then
            gh release edit android-test --notes "$notes" --prerelease
          else
            gh release create android-test --prerelease --target "$SHA" --title "Android test build" --notes "$notes"
          fi
          gh release upload android-test apk/myvan-test.apk --clobber
  gate:
    name: Android build
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env: { CHANGES: "${{ needs.changes.result }}", BUILD: "${{ needs.build.result }}" }
        run: |
          echo "changes=$CHANGES build=$BUILD"
          case "$CHANGES" in failure|cancelled) exit 1;; esac
          case "$BUILD" in failure|cancelled) exit 1;; esac
