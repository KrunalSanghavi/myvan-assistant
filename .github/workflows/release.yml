name: Release
# Push a tag like v2.1 (matching APP_VERSION in index.html) to publish a GitHub release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Tag matches app version
        run: |
          APP=$(grep -oP 'const APP_VERSION = "\K[\d.]+' index.html)
          [ "v$APP" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match APP_VERSION $APP"; exit 1; }
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env: { CI: "true" }
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" --title "MyVan Assistant $GITHUB_REF_NAME" --generate-notes --verify-tag
