name: Dependabot auto-merge
# Turns on auto-merge for Dependabot PRs. GitHub merges them only after every
# check required by the "main: require CI" ruleset passes; a failing PR stays open.
on: pull_request
permissions:
  contents: read
jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'KrunalSanghavi/myvan-assistant'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
